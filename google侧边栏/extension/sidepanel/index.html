<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>侧边栏 AI 助手</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="brand">
          <span class="mark" aria-hidden="true"></span>
          <div>
            <h1>侧栏助手</h1>
            <p class="sub" id="session-title">新会话</p>
          </div>
        </div>
        <div class="top-actions">
          <button type="button" id="btn-history" class="ghost" title="历史会话">历史</button>
          <button type="button" id="btn-new" class="ghost" title="新建会话">新建</button>
          <div class="status-wrap">
            <div id="status" class="status offline" title="后端连接状态">离线</div>
            <button
              type="button"
              id="btn-debug"
              class="icon-btn"
              title="开启远程调试（CDP）"
              aria-label="开启调试"
            >
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M14 7h-4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1Zm-5 2a5 5 0 0 1 10 0v1.17l1.4.81a1 1 0 1 1-1 1.74L18 11.94V13a1 1 0 1 1-2 0v-.5a1 1 0 1 0-2 0V18a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2v-5.5a1 1 0 1 0-2 0V13a1 1 0 1 1-2 0v-1.06l-1.4.78a1 1 0 1 1-1-1.74L5 10.17V9a5 5 0 0 1 4-4.9V6a3 3 0 0 0 6 0V4.1A5 5 0 0 1 9 9Zm1 11a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-1h-4v1Z"
                />
              </svg>
            </button>
          </div>
        </div>
      </header>

      <div id="mcp-badge" class="bound">
        <span class="bound-label">引擎</span>
        <span id="mcp-title" class="bound-title">Playwright MCP 检测中…</span>
      </div>

      <main class="chat">
        <div id="messages" class="messages" aria-live="polite"></div>

        <form id="chat-form" class="composer">
          <div id="pending" class="pending" hidden></div>
          <textarea
            id="prompt"
            rows="2"
            placeholder="例如：用 Playwright 打开百度，搜索天气，并总结结果"
          ></textarea>
          <div class="composer-actions">
            <div class="tools">
              <label id="btn-attach" class="ghost file-btn" title="上传文件（支持 Word/Excel/PDF/文本等）">
                文件
                <input
                  type="file"
                  id="file-input"
                  accept=".docx,.doc,.xlsx,.xls,.xlsm,.xlsb,.ods,.pdf,.txt,.md,.csv,.json"
                />
              </label>
            </div>
            <button type="submit" id="send-btn">发送</button>
          </div>
        </form>
      </main>

      <aside id="history-panel" class="history-panel" hidden>
        <div class="history-head">
          <strong>历史会话</strong>
          <button type="button" id="btn-history-close" class="ghost">关闭</button>
        </div>
        <ul id="history-list" class="history-list"></ul>
        <p id="history-empty" class="history-empty" hidden>暂无历史会话</p>
      </aside>
    </div>
    <script src="app.js" type="module"></script>
  </body>
</html>
